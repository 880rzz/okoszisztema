name: Restore graphical region selector
on:
  push:
    paths:
      - '.github/workflows/restore-graphical-region-filter-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore selector
        run: python3 scripts/restore_region_selector.py
      - name: Commit
        run: |
          git config user.name "Központi Ecosystem Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore graphical region selector for member organizations"
          git push
