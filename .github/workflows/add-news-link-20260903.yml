name: Add Rólunk.at news link
on:
  push:
    paths:
      - '.github/workflows/add-news-link-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add news link and press section
        run: python3 scripts/add_news_link.py
      - name: Commit
        run: |
          git config user.name "Központi Ecosystem Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Rólunk.at news section and navigation link"
          git push
