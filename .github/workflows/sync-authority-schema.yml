name: Sync authority schema across ecosystem HTML
on:
  push:
    branches: [main]
    paths: ['authority-graph.jsonld','rolunk-authority.json','.github/workflows/sync-authority-schema.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize central entity graph and inject authority graph into all HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          entity_path=Path('entity.json')
          if entity_path.exists():
              data=json.loads(entity_path.read_text(encoding='utf-8'))
              graph=data.get('@graph',[])
              byid={x.get('@id'):x for x in graph if isinstance(x,dict)}
              central=byid.get('https://www.kozpontiszovetseg.at/#organization')
              if central:
                  central['sameAs']=[
                      'https://www.wikidata.org/wiki/Q141274866',
                      'https://hu.wikipedia.org/wiki/Ausztriai_Magyar_Egyes%C3%BCletek_%C3%A9s_Szervezetek_K%C3%B6zponti_Sz%C3%B6vets%C3%A9ge',
                      'https://www.facebook.com/kozpontiszovetseg'
                  ]
                  subjects=central.get('subjectOf',[])
                  if not isinstance(subjects,list): subjects=[subjects]
                  if not any(isinstance(x,dict) and x.get('url')=='https://rolunk.at/tag/kozponti-szovetseg/' for x in subjects):
                      subjects.append({'@type':'CollectionPage','url':'https://rolunk.at/tag/kozponti-szovetseg/','name':'Rólunk.at – Központi Szövetség sajtóarchívum'})
                  central['subjectOf']=subjects
                  central['identifier']=[
                      {'@type':'PropertyValue','propertyID':'ZVR-Zahl','value':'079797621'},
                      {'@type':'PropertyValue','propertyID':'Wikidata','value':'Q141274866'}
                  ]
              bmi=byid.get('https://www.magyariskola.at/#school')
              if bmi:
                  bmi['sameAs']=['https://www.wikidata.org/wiki/Q141274560','https://hu.wikipedia.org/wiki/B%C3%A9csi_Magyar_Iskola']
                  subjects=bmi.get('subjectOf',[])
                  if not isinstance(subjects,list): subjects=[subjects]
                  if not any(isinstance(x,dict) and x.get('url')=='https://rolunk.at/tag/becsi-magyar-iskola/' for x in subjects):
                      subjects.append({'@type':'CollectionPage','url':'https://rolunk.at/tag/becsi-magyar-iskola/','name':'Rólunk.at – Bécsi Magyar Iskola sajtóarchívum'})
                  bmi['subjectOf']=subjects
              entity_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          source=Path('authority-graph.jsonld').read_text(encoding='utf-8').strip()
          start='<!-- ecosystem-authority-schema:start -->'; end='<!-- ecosystem-authority-schema:end -->'
          block=f'{start}\n<script type="application/ld+json">\n{source}\n</script>\n{end}'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(x in {'.git','node_modules','vendor'} for x in p.parts): continue
              s=p.read_text(encoding='utf-8')
              if start in s and end in s:
                  a=s.index(start); b=s.index(end,a)+len(end); n=s[:a]+block+s[b:]
              elif '</head>' in s: n=s.replace('</head>',block+'\n</head>',1)
              else: continue
              if n!=s: p.write_text(n,encoding='utf-8'); changed.append(str(p))
          print('updated',len(changed),'HTML files')
          PY
      - name: Commit synchronized graph and HTML
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ecosystem-schema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Normalize and sync Wikidata/Wikipedia/Rólunk authority graph"
          git push
