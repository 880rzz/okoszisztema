name: Audit curated member press evidence (read-only)
on:
  pull_request:
    paths:
      - "member-press-evidence.json"
      - "member-organizations.json"
      - "data/member-news.json"
      - "data/ecosystem-press.json"
      - "tools/merge_member_press_evidence.py"
      - ".github/workflows/merge-member-press-evidence-20260902.yml"
  push:
    branches: [main]
    paths:
      - "member-press-evidence.json"
      - "member-organizations.json"
      - "data/member-news.json"
      - "data/ecosystem-press.json"
      - "tools/merge_member_press_evidence.py"
      - ".github/workflows/merge-member-press-evidence-20260902.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical 29-member press without writing to main
        run: python3 tools/merge_member_press_evidence.py
