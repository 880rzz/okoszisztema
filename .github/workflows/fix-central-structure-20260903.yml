name: Verify Központi ecosystem canonical entities

on:
  push:
    paths:
      - 'index.html'
      - 'authority-graph.jsonld'
      - 'bmi-community-trust.html'
      - 'gdpr-ai-trust.html'
      - 'hirek/**'
      - 'intezmenyek/**'
      - 'tagszervezetek/**'
      - '.github/workflows/fix-central-structure-20260903.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'authority-graph.jsonld'
      - 'bmi-community-trust.html'
      - 'gdpr-ai-trust.html'
      - 'hirek/**'
      - 'intezmenyek/**'
      - 'tagszervezetek/**'
      - '.github/workflows/fix-central-structure-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical identity references and JSON-LD
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          old_person = "https://www.norbertbanhalmi.com/about/"
          old_school = "https://www.kozpontiszovetseg.at/#becsi-magyar-iskola-system"
          canonical_person = "https://www.wikidata.org/wiki/Q56391118"
          canonical_school = "https://www.magyariskola.at/#organization"
          paths = [p for p in Path(".").rglob("*.html") if ".git" not in p.parts]
          paths.extend(Path(".").glob("*.jsonld"))
          failures = []
          for path in paths:
              data = path.read_text(encoding="utf-8")
              if old_person in data:
                  failures.append(f"{path}: legacy person URL in generated HTML/JSON-LD")
              if old_school in data:
                  failures.append(f"{path}: non-canonical BMI entity ID")
              if path.suffix == ".jsonld":
                  try:
                      json.loads(data)
                  except json.JSONDecodeError as exc:
                      failures.append(f"{path}: invalid JSON-LD: {exc}")
              else:
                  blocks = re.findall(
                      r'<script[^>]*type=["\']application/ld\\+json["\'][^>]*>(.*?)</script>',
                      data,
                      re.I | re.S,
                  )
                  for index, block in enumerate(blocks):
                      try:
                          json.loads(block)
                      except json.JSONDecodeError as exc:
                          failures.append(f"{path} JSON-LD block {index}: {exc}")
          homepage = Path("index.html").read_text(encoding="utf-8")
          for expected in (canonical_person, canonical_school, "https://www.becsiszelet.at/#periodical"):
              if expected not in homepage:
                  failures.append(f"index.html: missing canonical entity {expected}")
          if failures:
              raise SystemExit("\\n".join(failures))
          print(f"Entity reference and JSON-LD validation passed: {len(paths)} files")
          PY
