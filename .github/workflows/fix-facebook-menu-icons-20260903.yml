name: Fix Facebook menu icons
on:
  push:
    paths:
      - '.github/workflows/fix-facebook-menu-icons-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_facebook_menu_icons.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Kozponti UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use consistent Facebook SVG icons in floating menu"
          git push
