name: Update official-name hero
on:
  push:
    paths:
      - '.github/workflows/update-hero-official-name-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_hero_official_name.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Kozponti UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use official responsive organization name in hero"
          git push
