name: Show Bécsi Napló links
on:
  push:
    paths:
      - '.github/workflows/show-becsi-naplo-links-20260903.yml'
      - 'scripts/show_becsi_naplo_links.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/show_becsi_naplo_links.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Kozponti UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show current and archive Bécsi Napló links"
          git push
