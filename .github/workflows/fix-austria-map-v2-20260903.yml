name: Fix Austria map v2
on:
  push:
    paths:
      - '.github/workflows/fix-austria-map-v2-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply map fix
        run: python3 scripts/fix_austria_map_v2.py
      - name: Commit
        run: |
          git config user.name "Központi Ecosystem Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix responsive Austria region map"
          git push
