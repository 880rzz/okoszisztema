name: Validate Központi institutional hierarchy (manual)
# The 2026-09-03 workflow used to rewrite index.html by replacing everything
# through </main>, unintentionally erasing the separate media and press sections.
# Keep this historical workflow name for traceability, but never mutate production
# content from a scheduled, automatic or manual verification job.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check institutional hierarchy without writing content
        run: |
          python3 scripts/check_entity_graph.py
          python3 scripts/validate_member_news.py
          python3 scripts/validate_authority_router.py
