name: Daily member press discovery and vetted-news sync
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: federation-member-news-steward
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Discover DORAPP press candidates (private review artifact only)
        run: |
          python3 scripts/collect_member_news_candidates.py \
            --organizations-out "$RUNNER_TEMP/dorapp-organizations.json" \
            --review-out "$RUNNER_TEMP/member-press-candidates.json"
      - name: Save unverified findings outside the published site
        uses: actions/upload-artifact@v4
        with:
          name: member-press-candidate-review
          path: ${{ runner.temp }}/member-press-candidates.json
          retention-days: 7
          if-no-files-found: error
      - name: Refresh strictly approved press and source-backed descriptions
        run: |
          python3 scripts/build_member_news.py --dorapp "$RUNNER_TEMP/dorapp-organizations.json"
          python3 scripts/enrich_member_news.py --limit 14 --shards 7
          python3 scripts/build_ecosystem_press.py
          python3 scripts/render_ecosystem_press.py
      - name: Run source, identity and code quality gates
        run: |
          python3 scripts/test_austrian_press_discovery.py
          python3 scripts/validate_member_news.py
          python3 scripts/build_member_news.py --check
          python3 scripts/validate_member_pages.py
          python3 scripts/build_ecosystem_press.py --check
          python3 scripts/validate_ecosystem_press.py
          python3 scripts/render_ecosystem_press.py --check
          node --check member-news.js
          node --check member-calendar.js
      - name: Detect meaningful approved changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- data/member-news.json data/ecosystem-press.json index.html hirek/index.html tagszervezetek/ intezmenyek/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new approved content: candidate review is still recorded."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open evidence-preserving PR, never write to main
        if: ${{ steps.changed.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh pr list --state open --json title --jq '.[].title' | grep -Fxq 'chore(news): sync approved member press'; then
            echo "::warning::An approved-news PR is already open. No duplicate or main write."
            exit 0
          fi
          BRANCH="automation/member-news-$GITHUB_RUN_ID"
          git switch -c "$BRANCH"
          git config user.name "federation-news-steward[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/member-news.json data/ecosystem-press.json index.html hirek/index.html tagszervezetek/ intezmenyek/
          git commit -m "chore(news): sync approved member press"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title 'chore(news): sync approved member press' \
            --body 'Napi forráskapuzott cikkleírás- és jóváhagyott sajtófrissítés. DORAPP jelöltek kizárólag privát ellenőrzési artefaktumban. Csak sikeres CI és konfliktusmentes PR után automatikus összevonás.')
          # GITHUB_TOKEN-initiated PR events do NOT trigger normal PR workflows.
          # Use the explicit workflow_dispatch exception to execute the real CI.
          NEW_SHA=$(git rev-parse HEAD)
          gh workflow run validate-members.yml --ref "$BRANCH"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow validate-members.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 12 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$NEW_SHA\") | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No exact-SHA CI run started. PR deliberately left open."
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status --interval 10
          PR_SHA=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          if [ "$PR_SHA" != "$NEW_SHA" ]; then
            echo "::error::PR head changed during validation; merge blocked."
            exit 1
          fi
          MERGE_STATE=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$MERGE_STATE" != "CLEAN" ]; then
            echo "::error::PR is not clean ($MERGE_STATE); merge blocked."
            exit 1
          fi
          # Required checks / reviews remain enforced by the GitHub merge API.
          gh pr merge "$PR_URL" --squash --delete-branch
