name: Verify authority schema parity (read-only)

# Prior workflow used to rewrite every HTML file and push directly to main.
# That bypassed branch/PR review and could inject shared schemas into
# standalone editorial and governance documents. This is now a CI gate.
on:
  pull_request:
    paths:
      - 'authority-graph.jsonld'
      - '*.html'
      - '**/*.html'
      - 'scripts/sync_authority_schema.py'
      - '.github/workflows/sync-authority-schema.yml'
  push:
    branches: [main]
    paths:
      - 'authority-graph.jsonld'
      - '*.html'
      - '**/*.html'
      - 'scripts/sync_authority_schema.py'
      - '.github/workflows/sync-authority-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the canonical graph and all explicitly marked HTML pages
        run: python3 scripts/sync_authority_schema.py
      - name: Recheck core entity identity and magazine publisher relationships
        run: python3 scripts/check_entity_graph.py
