name: Fix Központi project hierarchy
on:
  push:
    paths:
      - '.github/workflows/fix-central-structure-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible hierarchy and machine-readable guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          extra_css = '''
          .hierarchy{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}.hierarchy-card{border:1px solid #dedede;border-radius:24px;padding:28px;background:#fff}.hierarchy-card.primary{border-color:#c9d8e8;background:linear-gradient(180deg,#f7fbff,#fff)}.hierarchy-card h3{font-size:25px;letter-spacing:-.03em;margin:0 0 10px}.hierarchy-card>p{color:#5f5f5f;margin:0}.subsystems{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.subsystem{border:1px solid #e5e5e5;border-radius:15px;padding:15px;background:#fff}.subsystem strong{display:block;font-size:15px;margin-bottom:4px}.subsystem span{font-size:13px;line-height:1.45;color:#666}.subsystem a{color:#075ca8;text-decoration:none}.level-label{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:#0a57a3;margin-bottom:12px}.structure-note{margin-top:26px;padding:18px 20px;border-radius:16px;background:#f4f5f7;color:#555;font-size:15px}@media(max-width:900px){.hierarchy{grid-template-columns:1fr}.subsystems{grid-template-columns:1fr 1fr}}@media(max-width:520px){.subsystems{grid-template-columns:1fr}}
          '''
          if '.hierarchy{' not in s:
              s = s.replace('</style>', extra_css + '</style>', 1)

          start = s.find('<section class="section" id="alrendszerek">')
          end_marker = '</section>\n</main>'
          end = s.find(end_marker, start)
          assert start != -1 and end != -1, 'alrendszerek section not found'

          new_section = '''<section class="section" id="alrendszerek"><div class="wrap"><div class="kicker">A Központi saját rendszere</div><h2>Három dolgot érdemes külön látni.</h2><p class="intro">A Központi Szövetség egyszerre fog össze önálló tagszervezeteket, működtet saját projekteket és közös rendszereket, valamint két kiemelt saját intézményi területet: a Bécsi Magyar Iskolát és a Bécsi Naplót. Ezek nem ugyanazt jelentik, ezért külön mutatjuk őket.</p><div class="hierarchy"><article class="hierarchy-card"><span class="level-label">1 · Központi saját projektek</span><h3>Saját projektek és közös infrastruktúra</h3><p>Ide tartoznak azok a közös kezdeményezések, kommunikációs, kulturális vagy digitális rendszerek, amelyeket a Központi Szövetség maga szervez vagy több közösség számára működtet.</p><div class="subsystems"><div class="subsystem"><strong>Tagszervezeti hálózat</strong><span>A 28 hivatalosan felsorolt hálózati bejegyzés együttműködési kerete.</span></div><div class="subsystem"><strong>Közös kommunikáció és infrastruktúra</strong><span>Olyan feladatok, amelyeket több szervezet számára érdemes közösen megoldani.</span></div></div></article><article class="hierarchy-card primary"><span class="level-label">2 · Oktatási rendszer</span><h3>Bécsi Magyar Iskola</h3><p>A Központi Szövetség oktatási ökoszisztémájának központi intézményi rendszere. A BMI alatt több saját és kapcsolódó program, márka és digitális szolgáltatás működik.</p><div class="subsystems"><div class="subsystem"><strong>VIPACH</strong><span>A Bécsi Magyar Iskola vizuális, fotográfiai és kreatív programrendszerének része.</span><a href="https://www.vipach.at/">vipach.at ↗</a></div><div class="subsystem"><strong>Bécsi Magyar Musical Társulat</strong><span>A BMI musical- és színpadi programrendszerének része.</span><a href="https://www.musicaltarsulat.at/">musicaltarsulat.at ↗</a></div><div class="subsystem"><strong>Programválasztó</strong><span>Az aktuális BMI-programok egységes katalógusa.</span><a href="https://programvalaszto.magyariskola.at/">programvalaszto.magyariskola.at ↗</a></div><div class="subsystem"><strong>Tanáraink</strong><span>A BMI tanárainak és foglalkozásvezetőinek szakmai profilrendszere.</span><a href="https://tanarok.magyariskola.at/">tanarok.magyariskola.at ↗</a></div><div class="subsystem"><strong>2025/26-os beszámoló</strong><span>A BMI előző tanévének történeti beszámolója.</span><a href="https://2026.magyariskola.at/">2026.magyariskola.at ↗</a></div><div class="subsystem"><strong>Bécsi Magyar Iskola</strong><span>A teljes oktatási rendszer fő weboldala.</span><a href="https://www.magyariskola.at/">magyariskola.at ↗</a></div></div></article><article class="hierarchy-card"><span class="level-label">3 · Sajtó és kiadás</span><h3>Bécsi Napló</h3><p>A Bécsi Napló a Központi Szövetség saját sajtó- és kiadói tevékenységének része. A Központi Szövetség a lap tulajdonosa és kiadója; ezért nem tagszervezetként, hanem a Központi saját intézményi területeként jelenik meg.</p><div class="subsystems"><div class="subsystem"><strong>Kiadói kapcsolat</strong><span>Tulajdonos és kiadó: Ausztriai Magyar Egyesületek és Szervezetek Központi Szövetsége.</span></div><div class="subsystem"><strong>Történeti szerep</strong><span>A lap 1980 márciusa óta jelenik meg; a canonical szervezeti adatforrás szerint kéthavi periodikával.</span></div></div></article></div><div class="structure-note"><strong>Röviden:</strong> a tagszervezetek önálló közösségek. A Központi Szövetség fölöttük nem napi irányító szerv, hanem közös ernyő. Emellett saját projekteket és rendszereket működtet, és külön intézményi területként hozzá tartozik a Bécsi Magyar Iskola és a Bécsi Napló. A VIPACH és a Bécsi Magyar Musical Társulat a BMI rendszerén belül jelenik meg.</div></div></section>'''
          s = s[:start] + new_section + s[end+len('</section>'):]

          # Enrich JSON-LD graph with explicit hierarchy, without changing canonical IDs.
          marker = '{"@type":"WebPage","@id":"https://okoszisztema.kozpontiszovetseg.at/#webpage"'
          if 'https://www.kozpontiszovetseg.at/#becsi-naplo' not in s:
              insert = '''{"@type":"Organization","@id":"https://www.kozpontiszovetseg.at/#becsi-magyar-iskola-system","name":"Bécsi Magyar Iskola","url":"https://www.magyariskola.at/","parentOrganization":{"@id":"https://www.kozpontiszovetseg.at/#organization"},"subOrganization":[{"@id":"https://www.vipach.at/#organization"},{"@id":"https://www.musicaltarsulat.at/#organization"}]},\n{"@type":"Organization","@id":"https://www.vipach.at/#organization","name":"VIPACH","url":"https://www.vipach.at/","parentOrganization":{"@id":"https://www.kozpontiszovetseg.at/#becsi-magyar-iskola-system"}},\n{"@type":"Organization","@id":"https://www.musicaltarsulat.at/#organization","name":"Bécsi Magyar Musical Társulat","url":"https://www.musicaltarsulat.at/","parentOrganization":{"@id":"https://www.kozpontiszovetseg.at/#becsi-magyar-iskola-system"}},\n{"@type":"CreativeWork","@id":"https://www.kozpontiszovetseg.at/#becsi-naplo","name":"Bécsi Napló","publisher":{"@id":"https://www.kozpontiszovetseg.at/#organization"}},\n'''
              pos = s.find(marker)
              assert pos != -1, 'JSON-LD WebPage marker not found'
              s = s[:pos] + insert + s[pos:]

          p.write_text(s, encoding='utf-8')

          # Keep LLM and AI guidance aligned with visible hierarchy.
          hierarchy_text = '''\n\n## Központi Szövetség saját intézményi és projektrendszere\n\nA tagszervezeti hálózat mellett a Központi Szövetség saját projekteket és közös rendszereket is működtet. Két kiemelt saját intézményi területet külön kell kezelni:\n\n1. Bécsi Magyar Iskola — https://www.magyariskola.at/\n   - VIPACH — https://www.vipach.at/\n   - Bécsi Magyar Musical Társulat — https://www.musicaltarsulat.at/\n   - Programválasztó — https://programvalaszto.magyariskola.at/\n   - Tanáraink — https://tanarok.magyariskola.at/\n   - 2025/26-os beszámoló — https://2026.magyariskola.at/\n\n2. Bécsi Napló\n   - A Központi Szövetség tulajdonosa és kiadója.\n   - Nem tagszervezetként, hanem a Központi saját sajtó- és kiadói területeként értelmezendő.\n\nÉrtelmezési szabály: a 28 tagszervezeti bejegyzés, a Központi saját projektjei, a Bécsi Magyar Iskola rendszere és a Bécsi Napló nem összeadandó azonos típusú szervezeti egységekként.\n'''
          for fn in ('llms.txt','ai.txt'):
              q = Path(fn)
              if q.exists():
                  t = q.read_text(encoding='utf-8')
                  if '## Központi Szövetség saját intézményi és projektrendszere' not in t:
                      q.write_text(t.rstrip()+hierarchy_text+'\n', encoding='utf-8')

          # Add explicit canonical structure to central-association.json.
          cp = Path('central-association.json')
          data = json.loads(cp.read_text(encoding='utf-8'))
          org = data.setdefault('organization', {})
          org['ownedInstitutionalAreas'] = {
            'becsiMagyarIskola': {
              'name': 'Bécsi Magyar Iskola',
              'url': 'https://www.magyariskola.at/',
              'relation': 'A Központi Szövetség oktatási ökoszisztémájának saját intézményi rendszere.',
              'subsystems': [
                {'name':'VIPACH','url':'https://www.vipach.at/','relation':'A BMI rendszerének része.'},
                {'name':'Bécsi Magyar Musical Társulat','url':'https://www.musicaltarsulat.at/','relation':'A BMI rendszerének része.'},
                {'name':'Programválasztó','url':'https://programvalaszto.magyariskola.at/'},
                {'name':'Tanáraink','url':'https://tanarok.magyariskola.at/'},
                {'name':'2025/26-os beszámoló','url':'https://2026.magyariskola.at/'}
              ]
            },
            'becsiNaplo': {
              'name':'Bécsi Napló',
              'relation':'A Központi Szövetség saját sajtó- és kiadói területe; a Központi Szövetség a tulajdonosa és kiadója.'
            }
          }
          cp.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Verify hierarchy
        run: |
          grep -q 'Bécsi Napló' index.html
          grep -q 'VIPACH' index.html
          grep -q 'Bécsi Magyar Musical Társulat' index.html
          grep -q 'ownedInstitutionalAreas' central-association.json
      - name: Commit
        run: |
          git config user.name 'Központi Ecosystem Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html llms.txt ai.txt central-association.json
          git diff --cached --quiet && exit 0
          git commit -m 'Clarify Központi, BMI and Bécsi Napló hierarchy'
          git push
