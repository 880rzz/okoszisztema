name: Finalize Central Association ecosystem audit 20260902

on:
  push:
    paths:
      - '.github/workflows/finalize-central-association-audit-20260902.yml'
      - 'tools/finalize_central_association_audit.py'

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconcile and validate
        run: python3 tools/finalize_central_association_audit.py
      - name: Commit reconciled ecosystem
        run: |
          git config user.name "ecosystem-steward[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html KOZPONTI_SZOVETSEG_ECOSYSTEM_AUDIT_2026-09-02.md
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile Központi member network and visible ecosystem"
          git push
