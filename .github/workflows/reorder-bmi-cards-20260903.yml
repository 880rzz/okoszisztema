name: Reorder BMI cards
on:
  push:
    paths:
      - '.github/workflows/reorder-bmi-cards-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/reorder_bmi_cards_20260903.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Kozponti UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Move VIPACH and Musical cards to third BMI row"
          git push
