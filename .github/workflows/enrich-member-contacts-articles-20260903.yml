name: Enrich member contacts and profile articles

on:
  push:
    paths:
      - '.github/workflows/enrich-member-contacts-articles-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update member directory data
        shell: python
        run: |
          import json
          from pathlib import Path

          p = Path('member-organizations.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          official_source = 'https://www.kozpontiszovetseg.at/tagszervezetek'

          contacts = {
            'ausztriai-magyar-kutatointezet': ['andrea.seidler@univie.ac.at','marta.csire@univie.ac.at'],
            'lean-in-femspace': ['leaninfemspace@gmail.com'],
            'svung': ['svung.tarsulat@gmx.at','Katalin.Blasko@univie.ac.at'],
            'cserkesz-72-wien': ['becs@cserkesz.at','ildiko.piroska@cserkesz.at'],
            'bim-becsi-irodalmi-muhely': ['nadori.lidia@gmail.com'],
            'kalaka-club': ['elisabeth.wurst@gmx.at'],
            'napraforgok': ['napraforgok.tancegyuttes@gmail.com','mizseirichard@gmail.com'],
            'szent-istvan-egylet': ['ladislaus.batthyany@gmx.at'],
            'bornemisza-peter-tarsasag': ['bornemiszapetertarsasag@gmail.com'],
            'nemzetkozi-duna-filharmonia-barati-kor': ['agnes.katona@gmx.org'],
            'alsoori-magyar-kultur-es-tancegyesulet': ['magyaregyesulet.unterwart@gmail.com'],
            'irottko-sportegyesulet': ['beata.nemeth@gmx.at'],
            'kozep-burgenlandi-magyar-kulturegyesulet': ['lizafarkas@icloud.com','mbukv@gmx.at'],
            'felso-ausztriai-magyarok-kulturegyesulete': ['enikoe.toekes@gmail.com'],
            'linz-magyar-katolikus-kozosseg': ['ernest.szabo@dioezese-linz.at'],
            'felso-ausztriai-hetvegi-magyar-ovoda-es-iskola': ['magyariskola.wels@gmx.at','monikakladek@gmx.at'],
            'cserkesz-80-wels': ['wels@cserkesz.eu','istvan.altordai@evonik.com'],
            'salzung': ['salzburgerhunverein@gmail.com','ilonamikoczy@gmail.com'],
            'grazi-magyar-egyesulet': ['GME1888@gmx.at','molnar.a@gmx.at'],
            'magyar-egyetemistak-es-oregdiakok-klubja-graz': ['info@laszlovari.at'],
            'graci-magyar-katolikus-kozosseg': ['otto.molnar@laposte.net','e.solymos@hotmail.com'],
            'femconnect-graz': ['verein@femconnectgraz.at'],
            'magyarhaz-innsbruck': ['mail@ugarnheim.at','pepat@ikbnet.at'],
            'imike': ['ujkv.ibk@gmail.com'],
            'cserkesz-79-innsbruck': ['pfadfinder.ibk79@gmail.com'],
            'imeasz': ['info@imeasz.at'],
            'innsbrucki-magyar-katolikus-kozosseg': ['pepat@ikbnet.at'],
            'vorarlbergi-magyar-egyesulet': ['vorarlberg.ungverein@gmail.com','fugedi.henriette@gmail.com'],
            'mi-magyarok-egymasert': ['mime.vorarlberg@gmail.com','mazsi0810@gmail.com']
          }

          featured = {
            'lean-in-femspace': {'publisher':'Rólunk.at','title':'Lean In Femspace – ausztriai magyar nők közössége','url':'https://rolunk.at/magazin/lean-in-femspace-ausztriai-magyar-nok-kozossege/','date':'2022-01-19'},
            'bim-becsi-irodalmi-muhely': {'publisher':'Rólunk.at','title':'Bemutatkozott a Bécsi Irodalmi Műhely','url':'https://rolunk.at/kultura/bemutatkozott-a-becsi-irodalmi-muhely/','date':'2026-06-29'},
            'napraforgok': {'publisher':'ORF Magyarok','title':'Napraforgók és táncháztalálkozó Bécsben','url':'https://volksgruppen.orf.at/magyarok/stories/3154928/','date':'2022-05-05'},
            'kozep-burgenlandi-magyar-kulturegyesulet': {'publisher':'Rólunk.at','title':'Feladatunk, hogy a következő évszázadban is megmaradjon a magyar nyelv és kultúra Burgenlandban','url':'https://rolunk.at/nepcsoportunk/feladatunk-hogy-a-kovetkezo-evszazadban-is-megmaradjon-a-magyar-nyelv-es-kultura-burgenlandban/','date':'2022-01-18'},
            'felso-ausztriai-magyarok-kulturegyesulete': {'publisher':'ORF Magyarok','title':'50 éves lett a Felső-Ausztriai Magyarok Kultúregyesülete','url':'https://volksgruppen.orf.at/v2/magyarok/stories/2907261/','date':'2018-04-16'},
            'grazi-magyar-egyesulet': {'publisher':'Rólunk.at','title':'Grázi Magyar Egyesület – 133 éves Európa egyik legrégebbi egyesülete','url':'https://rolunk.at/nepcsoportunk/grazi-magyar-egyesulet/','date':'2021-12-07'},
            'magyar-egyetemistak-es-oregdiakok-klubja-graz': {'publisher':'Rólunk.at','title':'Megjelent a Gráci Magyar Újság legújabb száma','url':'https://rolunk.at/nepcsoportunk/megjelent-a-graci-magyar-ujsag-legujabb-szama/','date':'2022-08-19'},
            'femconnect-graz': {'publisher':'Rólunk.at','title':'FemConnect: új magyar kultúregyesület Grazban','url':'https://rolunk.at/kultura/femconnect-uj-magyar-kulturegyesulet-grazban/','date':'2024-09-23'},
            'imike': {'publisher':'Rólunk.at','title':'Okos(k)odni egy jó pofa sör mellett?','url':'https://rolunk.at/magazin/okoskodni-egy-jo-pofa-sor-mellett/','date':'2025-03-21'},
            'vorarlbergi-magyar-egyesulet': {'publisher':'ORF Magyarok','title':'Új tavasz, új remények Vorarlbergben','url':'https://volksgruppen.orf.at/magyarok/stories/3197605/','date':'2023-03-06'},
            'mi-magyarok-egymasert': {'publisher':'Rólunk.at','title':'Bemutatkozik a Mi Magyarok Egymásért – VIDEÓ','url':'https://rolunk.at/magazin/bemutatkozik-a-mi-magyarok-egymasert-video/','date':'2026-03-25'},
            'irottko-sportegyesulet': {'publisher':'Rólunk.at','title':'Két ország között egy közösségért','url':'https://rolunk.at/magazin/ket-orszag-kozott-egy-kozossegert/','date':'2026'}
          }

          for m in data.get('members', []):
              mid = m.get('id')
              if mid in contacts:
                  m['contact'] = {'emails': contacts[mid], 'source': official_source, 'verified': '2026-09-03'}
              if mid == 'irottko-sportegyesulet':
                  m['officialSource'] = official_source
                  m['url'] = 'https://irottkofutas.hu/'
                  m['facebook'] = 'https://www.facebook.com/groups/748296890091417/'
                  m['zvrAsPublished'] = '1807309556'
                  m['alternateName'] = 'Leichtathletikclub Geschriebenstein'
              if mid in featured:
                  m['featuredProfileArticle'] = featured[mid]
              elif m.get('pressEvidence'):
                  m['featuredProfileArticle'] = m['pressEvidence'][0]

          data['schemaVersion'] = '2026-09-03-v7'
          data.setdefault('pressResearch', {})['lastResearched'] = '2026-09-03'
          data['pressResearch']['sourcePriority'] = ['ORF Magyarok','Rólunk.at','official organization sources','reputable Austrian and Hungarian regional media']
          data['contactResearch'] = {'lastVerified':'2026-09-03','primarySource':official_source}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          htmlp = Path('index.html')
          html = htmlp.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="member-enrichment.css">'
          js = '<script src="member-enrichment.js" defer></script>'
          if css not in html:
              html = html.replace('</head>', css + '\n</head>')
          if js not in html:
              html = html.replace('</body>', js + '\n</body>')
          htmlp.write_text(html, encoding='utf-8')
      - name: Commit enrichment
        run: |
          git config user.name "ecosystem-steward"
          git config user.email "actions@users.noreply.github.com"
          git add member-organizations.json index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enrich all member cards with contacts and press profiles"
          git push
