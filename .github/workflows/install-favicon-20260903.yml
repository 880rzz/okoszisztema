name: Install ecosystem favicon
on:
  push:
    paths:
      - '.github/workflows/install-favicon-20260903.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download favicon source from repository issue-free inline asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          favicon_png = '''__FAVICONPNG__'''
          favicon_ico = '''__FAVICONICO__'''
          apple_png = '''__APPLEPNG__'''
          Path('favicon.png').write_bytes(base64.b64decode(favicon_png))
          Path('favicon.ico').write_bytes(base64.b64decode(favicon_ico))
          Path('apple-touch-icon.png').write_bytes(base64.b64decode(apple_png))
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          links='''<link rel="icon" href="/favicon.ico" sizes="any">\n<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">\n<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">'''
          import re
          s=re.sub(r'<link rel="icon"[^>]*>\s*','',s)
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>\s*','',s)
          marker='<link rel="canonical" href="https://okoszisztema.kozpontiszovetseg.at/">'
          if marker not in s: raise SystemExit('canonical marker missing')
          s=s.replace(marker,marker+'\n'+links,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Központi Ecosystem Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html favicon.png favicon.ico apple-touch-icon.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Központi crest favicon'
          git push
